kind = "web"
previewPath = "/"
title = "Velouria: The Compositional Guide"
description = "A browser-based composition guide with transposable harmony, notation, piano rolls, sound design, and environmental layering."
version = "1.0.0"
id = "artifacts/velouria-guide"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 23082

[services.development]
run = "pnpm --filter @workspace/velouria-guide run dev"

[services.production.build]
args = ["sh", "-c", "pnpm --filter @workspace/velouria-guide run build"]

[services.production.run]
args = ["sh", "-c", "pnpm --filter @workspace/velouria-guide run serve"]

[services.production.health.startup]
path = "/"

[services.env]
PORT = "23082"
BASE_PATH = "/"
